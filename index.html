<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#f2f2f2;font-family:system-ui,Tahoma,sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a}
.rd{width:38px;height:38px;border-radius:50%;background:#2a2a2c;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;font-size:19px;flex-shrink:0}
.rd.on{color:#f5b301}
.bd{position:absolute;top:-2px;inset-inline-end:-2px;background:#e5484d;color:#fff;font-size:10px;border-radius:8px;padding:0 5px}
.sb{flex:1;min-width:0;background:#2a2a2c;border-radius:20px;height:38px;display:flex;align-items:center;gap:6px;padding:0 12px;color:#9a9a9a;cursor:pointer;white-space:nowrap;overflow:hidden}
main{padding:12px 12px 110px;max-width:640px;margin:auto}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;max-width:620px;margin:auto;display:flex;gap:4px;padding:6px;background:#1c1c1ee6;backdrop-filter:blur(12px);border:1px solid #2a2a2a;border-radius:30px;z-index:6}
html[dir=ltr] nav{flex-direction:row-reverse}
.nb{flex:1;text-align:center;padding:7px 0;border-radius:22px;color:#9a9a9a;font-size:11px;cursor:pointer}
.nb i{display:block;font-size:22px}
.nb.on{background:#2c2c2e;color:#3b82f6}
.bn{overflow:hidden;border-radius:16px;direction:ltr}
.trk{display:flex;transition:transform .5s}
.sl{flex:0 0 100%;height:160px;position:relative;direction:rtl;background:#26215c;display:flex;align-items:flex-end;color:#fff;text-decoration:none;overflow:hidden}
html[dir=ltr] .sl{direction:ltr}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bt{position:relative;width:100%;padding:28px 14px 12px;background:linear-gradient(transparent,#000000cc)}
.bt b{display:block;font-size:17px}.bt span{font-size:13px;color:#ddd}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:#444;cursor:pointer}.dots i.on{background:#3b82f6}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.sec b{font-size:16px;font-weight:600}.sec b>i{margin-inline-end:6px}.sec a{font-size:13px;color:#9a9a9a;cursor:pointer}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.t{width:72px;flex-shrink:0;text-align:center;font-size:12px;cursor:pointer}
.t .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.ic{width:72px;height:72px;border-radius:17px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:#fff;flex-shrink:0}
.rt{color:#f5b301;font-size:11px}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #222;cursor:pointer}
.li .ic{width:56px;height:56px;border-radius:14px;font-size:22px}
.g{flex:1;min-width:0}.g b{font-weight:600}.g small{display:block;color:#9a9a9a;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;padding:1px 8px;border-radius:8px;background:#1d2b44;color:#85b7eb;margin-top:4px}
.gt{background:#3b82f6;color:#fff;border:0;border-radius:18px;padding:7px 16px;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit;display:inline-block}
.gt.s2{background:#2a2a2c;color:#f2f2f2}
.gt.red{background:#e5484d}
.star{font-size:20px;color:#9a9a9a;cursor:pointer;padding:4px}.star.on{color:#f5b301}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.chip{padding:7px 14px;border-radius:18px;background:#2a2a2c;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:#3b82f6}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc,.lk{padding:14px;border-radius:12px;background:#1c1c1e;cursor:pointer;display:flex;align-items:center;gap:8px;color:#f2f2f2;text-decoration:none;border:1px solid transparent}
.cc.on{border-color:#3b82f6}
.blue{background:#3b82f6;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.mut{color:#9a9a9a;font-size:13px}
.nt{display:flex;gap:10px;padding:12px;background:#1c1c1e;border-radius:12px;margin-bottom:8px}
.hero{position:relative;height:230px;margin:-12px -12px 0;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(14px + env(safe-area-inset-top)) 14px 14px}
.hero .cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,#111)}
.hero .rd{z-index:2;background:#000000aa}
.dtop{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #222}
.dtop .ic{width:84px;height:84px;font-size:34px;border-radius:21px}
.dtop h2{margin:0 0 8px;font-size:19px}
.stats{display:flex;overflow-x:auto;border-bottom:1px solid #222;padding:14px 0;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stats div{flex:1 0 auto;min-width:84px;text-align:center;padding:0 10px;font-size:15px}
.stats div+div{border-inline-start:1px solid #2a2a2a}
.stats small{display:block;color:#9a9a9a;font-size:11px;margin-bottom:6px}
.shots{display:flex;gap:10px;overflow-x:auto}
.shots img{height:280px;border-radius:14px;flex-shrink:0;background:#1c1c1e}
.desc{white-space:pre-wrap;line-height:1.8;color:#ddd;font-size:16px}
.rate{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.rate .big{font-size:44px;font-weight:600;line-height:1}
.stz{color:#f5b301;font-size:18px;letter-spacing:2px}
.pick{display:flex;gap:10px;justify-content:center;font-size:34px;color:#f5b301;padding:10px 0}
.pick span{cursor:pointer}
input,select,textarea{width:100%;padding:11px;margin-top:8px;background:#2a2a2c;color:#f2f2f2;border:0;border-radius:10px;font-family:inherit;font-size:15px}
.err{color:#ff7b7f;font-size:13px;margin-top:6px}
h3{margin:0 0 6px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#f2f2f2;color:#111;padding:8px 18px;border-radius:18px;font-size:13px;display:none;z-index:20}
</style>
</head>
<body>
<header id="hd">
 <div class="rd" data-a="nav" data-x="notif" aria-label="notifications"><i class="ti ti-bell"></i><span class="bd" id="bd" style="display:none"></span></div>
 <div class="sb" data-a="nav" data-x="search"><i class="ti ti-search"></i><span data-t="sph"></span></div>

</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,setDoc,updateDoc,deleteDoc,doc,onSnapshot,query,orderBy,serverTimestamp}
 from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

 from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ===== PWA: ئایکۆن و manifest خۆکار ===== */
(function(){
 try{
  const c=document.createElement("canvas");c.width=c.height=512;
  const g=c.getContext("2d");
  const gr=g.createLinearGradient(0,0,512,512);gr.addColorStop(0,"#3b82f6");gr.addColorStop(1,"#6c3cf0");
  g.fillStyle=gr;g.fillRect(0,0,512,512);
  g.fillStyle="#ffffff";g.font="bold 230px system-ui,Arial,sans-serif";g.textAlign="center";g.textBaseline="middle";
  g.fillText("EM",256,274);
  const png=c.toDataURL("image/png");
  document.getElementById("ati").href=png;
  const base=location.href.split("#")[0].split("?")[0];
  const m={name:"EM App",short_name:"EM App",start_url:base,scope:base,display:"standalone",background_color:"#111111",theme_color:"#111111",icons:[{src:png,sizes:"512x512",type:"image/png"}]};
  document.getElementById("mf").href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));
 }catch(e){}
})();

const firebaseConfig={apiKey:"AIzaSyCyCZ2xcRwETnlnaVjf-ZajOpHGktfgPG0",authDomain:"emapp-97eff.firebaseapp.com",projectId:"emapp-97eff",storageBucket:"emapp-97eff.firebasestorage.app",messagingSenderId:"613299423776",appId:"1:613299423776:web:e82587f3a26683c496ca45"};

// سۆشیاڵ میدیا: [ئایکۆن، ناو، کلیل]. لینکەکان لە ئادمین دەگۆڕدرێن
const SOC=[["ti-brand-instagram","Instagram","instagram"],["ti-brand-telegram","Telegram","telegram"],
 ["ti-brand-snapchat","Snapchat","snapchat"],["ti-brand-whatsapp","WhatsApp","whatsapp"],
 ["ti-brand-tiktok","TikTok","tiktok"],["ti-brand-facebook","Facebook","facebook"]];

const CATS=["هەموو","یاری","ئامراز","کۆمەڵایەتی","خوێندن","وێنە"];

/* ===== وەرگێڕان ===== */
const I18N={
ckb:{
 sph:"یاری، بەرنامە، هتد",n_search:"گەڕان",n_more:"زیاتر",n_fav:"تایبەت",n_apps:"ئەپەکان",n_home:"ماڵەوە",
 welcome:"بەخێربێیت بۆ EM App",welcomeSub:"باشترین ئەپەکان لە یەک شوێن",
 newest:"نوێترین ئەپەکان",best:"باشترینەکان",recent:"بەم دواییە",all:"گشت",
 noApps:"هێشتا ئەپ زیاد نەکراوە",noAppsFound:"هیچ ئەپێک نییە",noRatings:"هێشتا هەڵسەنگاندن نییە",
 get:"وەرگرتن",again:"دووبارە",share:"هاوبەشکردن",noLink:"لینک نییە",
 ver:"وەشان",size:"قەبارە",type:"جۆر",rating:"هەڵسەنگاندن",updated:"نوێکراوەتەوە",today:"ئەمڕۆ",
 about:"دەربارە",shots:"وێنەکان",rateIt:"ئەم ئەپە هەڵبسەنگێنە",yourRate:n=>`هەڵسەنگاندنی تۆ: ${n} لە ٥`,nRatings:n=>`${n} هەڵسەنگاندن`,
 like:"لەوانەیە ئەمانەشت بەدڵبێت",sortNew:"نوێترین",sortTop:"باشترین هەڵسەنگاندن",
 favTitle:"تایبەت",favEmpty:"ئەستێرە لەسەر ئەپێک دابنێ بۆ زیادکردنی",
 social:"تۆڕەکانمان",language:"زمان",searchPh2:"گەڕان بۆ ئەپ...",sections:"بەشەکان",noResults:"هیچ ئەپێک نەدۆزرایەوە",
 notifTitle:"ئاگادارکردنەوەکان",notifNone:"ئاگادارکردنەوە نییە",
 copied:"لینک کۆپی کرا",thanks:"سوپاس بۆ هەڵسەنگاندنەکەت",wait:"چاوەڕێ بکە و دووبارە هەوڵ بدەرەوە",notFound:"ئەپەکە نەدۆزرایەوە",
 cats:{"هەموو":"هەموو","یاری":"یاری","ئامراز":"ئامراز","کۆمەڵایەتی":"کۆمەڵایەتی","خوێندن":"خوێندن","وێنە":"وێنە"}
},
en:{
 sph:"Games, apps, etc.",n_search:"Search",n_more:"More",n_fav:"Favorites",n_apps:"Apps",n_home:"Home",
 welcome:"Welcome to EM App",welcomeSub:"The best apps in one place",
 newest:"Newest apps",best:"Top rated",recent:"Recently added",all:"See all",
 noApps:"No apps added yet",noAppsFound:"No apps found",noRatings:"No ratings yet",
 get:"Get",again:"Again",share:"Share",noLink:"No link",
 ver:"Version",size:"Size",type:"Category",rating:"Rating",updated:"Updated",today:"Today",
 about:"About",shots:"Screenshots",rateIt:"Rate this app",yourRate:n=>`Your rating: ${n} of 5`,nRatings:n=>`${n} ratings`,
 like:"You might also like",sortNew:"Newest",sortTop:"Top rated",
 favTitle:"Favorites",favEmpty:"Tap the star on an app to add it here",
 social:"Our networks",language:"Language",searchPh2:"Search for an app...",sections:"Categories",noResults:"No apps found",
 notifTitle:"Notifications",notifNone:"No notifications",
 copied:"Link copied",thanks:"Thanks for your rating",wait:"Please wait and try again",notFound:"App not found",
 cats:{"هەموو":"All","یاری":"Games","ئامراز":"Tools","کۆمەڵایەتی":"Social","خوێندن":"Education","وێنە":"Photo"}
},
ar:{
 sph:"ألعاب، تطبيقات، إلخ",n_search:"بحث",n_more:"المزيد",n_fav:"المفضلة",n_apps:"التطبيقات",n_home:"الرئيسية",
 welcome:"مرحباً بك في EM App",welcomeSub:"أفضل التطبيقات في مكان واحد",
 newest:"أحدث التطبيقات",best:"الأعلى تقييماً",recent:"أُضيف مؤخراً",all:"عرض الكل",
 noApps:"لم تتم إضافة تطبيقات بعد",noAppsFound:"لا توجد تطبيقات",noRatings:"لا توجد تقييمات بعد",
 get:"تحميل",again:"مرة أخرى",share:"مشاركة",noLink:"لا يوجد رابط",
 ver:"الإصدار",size:"الحجم",type:"الفئة",rating:"التقييم",updated:"آخر تحديث",today:"اليوم",
 about:"حول التطبيق",shots:"لقطات الشاشة",rateIt:"قيّم هذا التطبيق",yourRate:n=>`تقييمك: ${n} من 5`,nRatings:n=>`${n} تقييم`,
 like:"قد يعجبك أيضاً",sortNew:"الأحدث",sortTop:"الأعلى تقييماً",
 favTitle:"المفضلة",favEmpty:"اضغط على النجمة بجانب أي تطبيق لإضافته هنا",
 social:"حساباتنا",language:"اللغة",searchPh2:"ابحث عن تطبيق...",sections:"الأقسام",noResults:"لم يتم العثور على تطبيقات",
 notifTitle:"الإشعارات",notifNone:"لا توجد إشعارات",
 copied:"تم نسخ الرابط",thanks:"شكراً على تقييمك",wait:"انتظر وحاول مرة أخرى",notFound:"التطبيق غير موجود",
 cats:{"هەموو":"الكل","یاری":"ألعاب","ئامراز":"أدوات","کۆمەڵایەتی":"تواصل اجتماعي","خوێندن":"تعليم","وێنە":"صور"}
}};
let lang=localStorage.getItem("em_lang")||"ckb";if(!I18N[lang])lang="ckb";
const T=k=>{const v=I18N[lang][k];return v===undefined?I18N.ckb[k]:v};
const cn=c=>I18N[lang].cats[c]||c;
const dsc=a=>lang==="en"?(a.descEn||a.desc):lang==="ar"?(a.descAr||a.desc):a.desc;
function applyStatic(){
 const h=document.documentElement;h.lang=lang;h.dir=lang==="en"?"ltr":"rtl";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T(e.dataset.t));
}
function setLang(l){lang=l;localStorage.setItem("em_lang",l);applyStatic();draw()}

const fb=initializeApp(firebaseConfig),db=getFirestore(fb),auth=getAuth(fb);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let apps=[],notices=[],banners=[],ratings=[],social={},user=null,uid=null;
let v="home",prev="home",curApp=null,cat="هەموو",sortBy="new",q="",sl=0,tm,editId=null;
let favs=LS("em_favs",[]),gots=LS("em_got",[]),seen=+localStorage.getItem("em_seen")||0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=u=>/^https?:\/\//i.test(u||"")?u:"";
const hue=a=>[...(a.name||"?")].reduce((n,c)=>n+c.charCodeAt(0),0)%360;
const empty=t=>`<p class="mut" style="text-align:center;padding:24px 0">${t}</p>`;
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",1800)}

/* هەڵسەنگاندن */
const rt=id=>{const l=ratings.filter(r=>r.app===id);return {n:l.length,avg:l.length?l.reduce((s,r)=>s+r.stars,0)/l.length:0}};
const mine=id=>ratings.find(r=>r.id===id+"_"+uid)?.stars||0;
const stz=n=>[1,2,3,4,5].map(i=>i<=Math.round(n)?"★":"☆").join("");
const gAvg=()=>ratings.length?ratings.reduce((s,r)=>s+r.stars,0)/ratings.length:0;
const score=a=>{const r=rt(a.id);return (r.n*r.avg+3*gAvg())/(r.n+3)};
const best=()=>apps.filter(a=>rt(a.id).n>0).sort((x,y)=>score(y)-score(x)||rt(y.id).n-rt(x.id).n);

/* پێکهاتەکان */
const icon=a=>url(a.icon)?`<img class="ic" src="${esc(a.icon)}" alt="">`:
 `<div class="ic" style="background:hsl(${hue(a)} 45% 35%)">${esc((a.name||"?")[0])}</div>`;
const tile=a=>`<div class="t" data-a="open" data-x="${a.id}">${icon(a)}<div class="n">${esc(a.name)}</div></div>`;
const rtile=a=>`<div class="t" data-a="open" data-x="${a.id}">${icon(a)}<div class="n">${esc(a.name)}</div><div class="rt">★ ${rt(a.id).avg.toFixed(1)}</div></div>`;
const row=a=>`<div class="li" data-a="open" data-x="${a.id}">${icon(a)}<div class="g"><b>${esc(a.name)}</b><small>${esc(dsc(a))}</small>
 <span class="tag">${esc(cn(a.cat))}</span>${rt(a.id).n?`<span class="rt"> ★ ${rt(a.id).avg.toFixed(1)}</span>`:""}</div>
 <i class="ti ti-star star ${favs.includes(a.id)?"on":""}" data-a="fav" data-x="${a.id}"></i>
 ${url(a.link)?`<a class="gt" data-got="${a.id}" href="${esc(a.link)}" target="_blank" rel="noopener">${gots.includes(a.id)?T("again"):T("get")}</a>`:""}</div>`;
const sec=(t,i,go)=>`<div class="sec"><b><i class="ti ${i}"></i>${t}</b><a data-a="nav" data-x="${go}">${T("all")}</a></div>`;
const fdate=a=>{const t=(a.upd||a.created)?.toDate?.();if(!t)return "—";return t.toDateString()===new Date().toDateString()?T("today"):t.toLocaleDateString("en-GB")};
const backIcon=()=>`<i class="ti ti-arrow-${lang==="en"?"left":"right"}"></i>`;

const slide=b=>{
 const inner=`${url(b.img)?`<img src="${esc(b.img)}" alt="">`:""}<div class="bt"><b>${esc(b.title)}</b><span>${esc(b.sub)}</span></div>`;
 return url(b.link)?`<a class="sl" href="${esc(b.link)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="sl">${inner}</div>`;
};
const hero=()=>{
 const list=banners.length?banners:[{title:T("welcome"),sub:T("welcomeSub")}];
 return `<div class="bn"><div class="trk" id="trk">${list.map(slide).join("")}</div></div>`+
  (list.length>1?`<div class="dots" id="dots">${list.map((_,i)=>`<i data-a="slide" data-x="${i}"></i>`).join("")}</div>`:"");
};

function detailPage(){
 const a=apps.find(x=>x.id===curApp);
 if(!a)return `<div class="rd" data-a="back">${backIcon()}</div>`+empty(T("notFound"));
 const shots=String(a.shots||"").split(/[\s,]+/).filter(url);
 const more=apps.filter(x=>x.id!==a.id).sort((x,y)=>(y.cat===a.cat)-(x.cat===a.cat)).slice(0,8);
 const r=rt(a.id),my=mine(a.id),got=gots.includes(a.id)&&url(a.link);
 return `<div class="hero" style="background:hsl(${hue(a)} 35% 18%)">
  ${url(a.cover)?`<img class="cv" src="${esc(a.cover)}" alt="">`:""}
  <div class="rd" data-a="back" aria-label="back">${backIcon()}</div>
  <div class="rd ${favs.includes(a.id)?"on":""}" data-a="fav" data-x="${a.id}" aria-label="bookmark"><i class="ti ti-bookmark"></i></div></div>
 <div class="dtop">${icon(a)}<div class="g"><h2>${esc(a.name)}</h2>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
   ${url(a.link)?`<a class="gt" data-got="${a.id}" href="${esc(a.link)}" target="_blank" rel="noopener">${T("get")}</a>`:`<span class="mut">${T("noLink")}</span>`}
   ${got?`<a class="gt s2" href="${esc(a.link)}" target="_blank" rel="noopener">${T("again")}</a>`:""}
   <button class="gt s2" data-a="share" data-x="${a.id}">${T("share")}</button>
   <span class="tag">${esc(cn(a.cat))}</span></div></div></div>
 <div class="stats"><div><small>${T("ver")}</small>${esc(a.ver||"—")}</div><div><small>${T("size")}</small>${esc(a.size||"—")}</div>
  <div><small>${T("type")}</small>${esc(cn(a.cat))}</div><div><small>${T("rating")}</small>${r.n?r.avg.toFixed(1)+" ★":"—"}</div>
  <div><small>${T("updated")}</small>${fdate(a)}</div></div>
 <div class="sec"><b class="mut" style="font-weight:400">${T("about")}</b></div><div class="desc">${esc(dsc(a)||"")}</div>
 ${shots.length?`<div class="sec"><b>${T("shots")}</b></div><div class="shots">${shots.map(s=>`<img src="${esc(s)}" alt="" loading="lazy">`).join("")}</div>`:""}
 <div class="sec"><b>${T("rating")}</b></div>
 <div class="rate"><div class="big">${r.n?r.avg.toFixed(1):"—"}</div><div><div class="stz">${stz(r.avg)}</div><div class="mut">${r.n?T("nRatings")(r.n):T("noRatings")}</div></div></div>
 <div class="mut" style="text-align:center">${my?T("yourRate")(my):T("rateIt")}</div>
 <div class="pick">${[1,2,3,4,5].map(i=>`<span data-a="rate" data-x="${a.id}:${i}">${i<=my?"★":"☆"}</span>`).join("")}</div>
 ${more.length?`<div class="sec"><b>${T("like")}</b><a data-a="nav" data-x="apps">${T("all")}</a></div><div class="hs">${more.map(tile).join("")}</div>`:""}`;
}

/* ئادمین (بە کوردی دەمێنێتەوە) */
function adminPage(){
 return `<h3>پڕکردنەوەی خۆکار لە App Store</h3>
 <input id="asl" dir="ltr" placeholder="لینکی App Store لێرە دابنێ"><button class="gt s2" style="margin-top:8px" data-a="fetchapp">پڕکردنەوەی خۆکار</button><div class="err" id="afe"></div>
 <h3 id="ft" style="margin-top:22px">زیادکردنی ئەپ</h3>
 <input id="n" placeholder="ناوی ئەپ"><select id="c">${CATS.slice(1).map(c=>`<option>${c}</option>`).join("")}</select>
 <textarea id="d" rows="3" placeholder="وەسفی کوردی"></textarea>
 <textarea id="den" dir="ltr" rows="3" placeholder="English description"></textarea>
 <textarea id="dar" rows="3" placeholder="الوصف بالعربية"></textarea>
 <input id="ver" placeholder="وەشان (نموونە: 1.2.0)"><input id="size" placeholder="قەبارە (نموونە: 85 MB)">
 <input id="i" dir="ltr" placeholder="لینکی وێنەی ئایکۆن (https://...)">
 <input id="cv" dir="ltr" placeholder="لینکی وێنەی بانەری سەرەوەی لاپەڕەی ئەپ">
 <textarea id="sh" dir="ltr" rows="2" placeholder="لینکی وێنەی شاشە، بە کۆما یان هێڵی نوێ جیایان بکەرەوە"></textarea>
 <input id="l" dir="ltr" placeholder="لینکی App Store یان TestFlight"><div class="err" id="ae"></div>
 <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
  <button class="gt" id="sv" data-a="addapp">زیادکردن</button>
  <button class="gt s2" id="cx" data-a="cancel" style="display:none">پاشگەزبوونەوە</button>
  <button class="gt red" data-a="logout">دەرچوون</button></div>
 <h3 style="margin-top:26px">لینکی سۆشیاڵ میدیا</h3>
 <div class="mut">لینکی تەواو یان بەبێ https بنووسە. بۆ WhatsApp ژمارەکە بنووسە (نموونە: 9647501234567). بەتاڵی بهێڵەوە ئەگەر نایەوێت.</div>
 ${SOC.map(s=>`<input id="s_${s[2]}" dir="ltr" placeholder="${s[1]}">`).join("")}
 <div class="err" id="se"></div>
 <button class="gt" style="margin-top:10px" data-a="savesoc">هەڵگرتنی لینکەکان</button>
 <h3 style="margin-top:26px">زیادکردنی بانەر</h3>
 <input id="bt" placeholder="ناونیشان"><input id="bs" placeholder="دەقی ژێرەوە"><input id="bi" dir="ltr" placeholder="لینکی وێنەی بانەر">
 <input id="bl" dir="ltr" placeholder="لینکی کلیک (ئارەزوومەندانە)"><div class="err" id="be"></div>
 <button class="gt" style="margin-top:10px" data-a="addban">زیادکردن</button>
 <h3 style="margin-top:26px">ئاگادارکردنەوەی نوێ</h3><input id="nt" placeholder="ناونیشان"><input id="nb" placeholder="دەق">
 <button class="gt" style="margin-top:10px" data-a="addnote">بڵاوکردنەوە</button>
 <h3 style="margin-top:26px">ئەپەکان</h3><div id="al"></div>
 <h3 style="margin-top:26px">بانەرەکان</h3><div id="bll"></div>
 <h3 style="margin-top:26px">ئاگادارکردنەوەکان</h3><div id="nl"></div>`;
}
const loginPage=()=>`<h3>چوونەژوورەوەی ئادمین</h3><input id="u" dir="ltr" type="email" placeholder="ئیمەیڵ"><input id="p" dir="ltr" type="password" placeholder="وشەی نهێنی">
 <div class="err" id="le"></div><button class="gt" style="margin-top:10px" data-a="login">چوونەژوورەوە</button>`;

function morePage(){
 const soc=SOC.filter(s=>url(social[s[2]]));
 return `<div class="blue"><div style="width:48px;height:48px;border-radius:12px;background:#111;display:flex;align-items:center;justify-content:center;font-weight:700">EM</div>
  <div style="flex:1"><b>EM App</b><div style="font-size:12px">V1.6.0</div></div></div>
  <div class="cg" style="margin-top:12px"><div class="cc" data-a="nav" data-x="lang"><i class="ti ti-language"></i>${T("language")}</div></div>
  ${soc.length?`<div class="mut" style="margin:18px 0 8px">${T("social")}</div>
  <div class="cg">${soc.map(s=>`<a class="lk" href="${esc(social[s[2]])}" target="_blank" rel="noopener"><i class="ti ${s[0]}"></i>${s[1]}</a>`).join("")}</div>`:""}`;
}

function page(){
 if(v==="home")return hero()+
  sec(T("newest"),"ti-flame","apps")+(apps.length?`<div class="hs">${apps.slice(0,8).map(tile).join("")}</div>`:empty(T("noApps")))+
  (best().length?sec(T("best"),"ti-trophy","top")+`<div class="hs">${best().slice(0,8).map(rtile).join("")}</div>`:"")+
  sec(T("recent"),"ti-history","apps")+apps.slice(0,5).map(row).join("");
 if(v==="detail")return detailPage();
 if(v==="top")return `<h3>${T("best")}</h3>`+(best().map(row).join("")||empty(T("noRatings")));
 if(v==="apps"){
  let l=apps.filter(a=>cat==="هەموو"||a.cat===cat);
  if(sortBy==="top")l=l.slice().sort((x,y)=>score(y)-score(x));
  return `<div class="chips">${CATS.map(c=>`<div class="chip ${c===cat?"on":""}" data-a="cat" data-x="${c}">${cn(c)}</div>`).join("")}</div>
  <div class="chips"><div class="chip ${sortBy==="new"?"on":""}" data-a="sort" data-x="new">${T("sortNew")}</div>
  <div class="chip ${sortBy==="top"?"on":""}" data-a="sort" data-x="top">${T("sortTop")}</div></div>`+(l.map(row).join("")||empty(T("noAppsFound")));
 }
 if(v==="fav")return `<h3>${T("favTitle")}</h3>`+(apps.filter(a=>favs.includes(a.id)).map(row).join("")||empty(T("favEmpty")));
 if(v==="lang")return `<h3>${T("language")}</h3><div class="cg" style="margin-top:10px">
  ${[["ckb","کوردی"],["en","English"],["ar","العربية"]].map(l=>`<div class="cc ${lang===l[0]?"on":""}" data-a="setlang" data-x="${l[0]}"><i class="ti ti-language"></i>${l[1]}</div>`).join("")}</div>`;
 if(v==="more")return morePage();
 if(v==="search")return `<input id="si" value="${esc(q)}" placeholder="${esc(T("searchPh2"))}" autocomplete="off"><div id="sr" style="margin-top:8px"></div>`;
 if(v==="notif")return `<h3>${T("notifTitle")}</h3>`+(notices.map(n=>`<div class="nt"><i class="ti ti-bell" style="color:#3b82f6;font-size:20px"></i><div><b>${esc(n.title)}</b><div class="mut">${esc(n.body)}</div></div></div>`).join("")||empty(T("notifNone")));
 if(v==="admin")return user?adminPage():loginPage();
}
const dl=(items,label,col,edit)=>items.map(a=>`<div class="li" style="cursor:default"><div class="g">${esc(label(a))}</div>
 ${edit?`<button class="gt s2" data-a="edit" data-x="${a.id}">دەستکاری</button>`:""}
 <button class="gt red" data-a="del" data-x="${col}:${a.id}">سڕینەوە</button></div>`).join("");
function lists(){
 if($("al"))$("al").innerHTML=dl(apps,a=>a.name,"apps",true);
 if($("bll"))$("bll").innerHTML=dl(banners,b=>b.title,"banners");
 if($("nl"))$("nl").innerHTML=dl(notices,n=>n.title,"notices");
}
function fillSocial(){
 SOC.forEach(s=>{const e=$("s_"+s[2]);if(e&&document.activeElement!==e)e.value=social[s[2]]||""});
}
function formMode(){
 if(!$("ft"))return;
 $("ft").textContent=editId?"دەستکاریکردنی ئەپ":"زیادکردنی ئەپ";
 $("sv").textContent=editId?"هەڵگرتنی گۆڕانکاری":"زیادکردن";
 $("cx").style.display=editId?"inline-block":"none";
}
function resetForm(){editId=null;["n","d","den","dar","ver","size","i","cv","sh","l"].forEach(k=>$(k).value="");$("ae").textContent="";formMode()}
function results(){
 if(!$("sr"))return;
 const r=q?apps.filter(a=>(a.name||"").toLowerCase().includes(q.toLowerCase())):[];
 $("sr").innerHTML=q?(r.map(row).join("")||empty(T("noResults"))):
  `<div class="sec"><b>${T("sections")}</b></div><div class="cg">${CATS.slice(1).map(c=>`<div class="cc" data-a="cat2" data-x="${c}">${cn(c)} (${apps.filter(a=>a.cat===c).length})</div>`).join("")}</div>`;
}
function badge(){const n=Math.max(0,notices.length-seen);$("bd").style.display=n?"block":"none";$("bd").textContent=n}
function go2(i){sl=i;const t=$("trk");if(t)t.style.transform=`translateX(${-100*i}%)`;document.querySelectorAll("#dots i").forEach((d,j)=>d.classList.toggle("on",j===i))}
function carousel(){
 clearInterval(tm);const n=banners.length;if(n<2)return;
 tm=setInterval(()=>{if(v!=="home"||!$("trk")){clearInterval(tm);return}go2((sl+1)%n)},4000);
}
function draw(){
 const d=v==="detail";
 $("hd").style.display=d?"none":"flex";$("nav").style.display=d?"none":"flex";
 $("main").innerHTML=page();
 document.querySelectorAll("#nav .nb").forEach(n=>n.classList.toggle("on",n.dataset.x===v));
 const si=$("si");if(si)si.oninput=()=>{q=si.value;results()};
 results();lists();fillSocial();formMode();badge();
 if(v==="home"){if(sl>=Math.max(1,banners.length))sl=0;go2(sl);carousel()}else clearInterval(tm);
}
function refresh(){
 if(v==="admin"){if(user){lists();fillSocial();badge()}}
 else if(v==="search"){results();badge()}
 else draw();
}
function go(x){
 editId=null;v=x;
 if(x==="notif"){seen=notices.length;localStorage.setItem("em_seen",seen)}
 history.replaceState(null,"",x==="admin"?"#admin":location.pathname);draw();scrollTo(0,0);
}

/* داتا لە Firebase */
onSnapshot(query(collection(db,"apps"),orderBy("created","desc")),s=>{apps=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});
onSnapshot(query(collection(db,"notices"),orderBy("created","desc")),s=>{notices=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});
onSnapshot(query(collection(db,"banners"),orderBy("created","desc")),s=>{banners=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});
onSnapshot(collection(db,"ratings"),s=>{ratings=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});
onSnapshot(doc(db,"settings","social"),s=>{social=s.exists()?s.data():{};refresh()},()=>{});
onAuthStateChanged(auth,u=>{
 if(!u){signInAnonymously(auth).catch(()=>{});return}
 uid=u.uid;user=u.isAnonymous?null:u;
 if(v==="admin")draw();
});

/* کلیکەکان */
document.addEventListener("click",async e=>{
 const gl=e.target.closest("a[data-got]");
 if(gl){
  const id=gl.dataset.got;
  if(!gots.includes(id)){gots=[...gots,id];localStorage.setItem("em_got",JSON.stringify(gots));setTimeout(()=>{if(v!=="admin")draw()},400)}
  return;
 }
 if(e.target.closest("a[href]"))return;
 const t=e.target.closest("[data-a]");if(!t)return;
 const a=t.dataset.a,x=t.dataset.x;
 if(a==="nav")go(x);
 else if(a==="setlang")setLang(x);
 else if(a==="open"){if(v!=="detail")prev=v;curApp=x;v="detail";draw();scrollTo(0,0)}
 else if(a==="back"){v=prev||"home";draw();scrollTo(0,0)}
 else if(a==="cat"){cat=x;draw()}
 else if(a==="cat2"){cat=x;go("apps")}
 else if(a==="sort"){sortBy=x;draw()}
 else if(a==="slide"){go2(+x);carousel()}
 else if(a==="fav"){favs=favs.includes(x)?favs.filter(i=>i!==x):[...favs,x];localStorage.setItem("em_favs",JSON.stringify(favs));
  const y=scrollY;draw();scrollTo(0,y)}
 else if(a==="share"){
  const ap=apps.find(i=>i.id===x);if(!ap)return;
  const link=url(ap.link)||location.href.split("#")[0];
  if(navigator.share){try{await navigator.share({title:ap.name,text:dsc(ap),url:link})}catch{}}
  else{try{await navigator.clipboard.writeText(link);toast(T("copied"))}catch{prompt("Link:",link)}}
 }
 else if(a==="rate"){
  const [id,n]=x.split(":");
  if(!uid){toast(T("wait"));return}
  try{await setDoc(doc(db,"ratings",id+"_"+uid),{app:id,uid,stars:+n});toast(T("thanks"))}
  catch(err){toast("Error: "+err.message)}
 }
 else if(a==="login"){
  try{await signInWithEmailAndPassword(auth,$("u").value.trim(),$("p").value)}
  catch{$("le").textContent="ئیمەیڵ یان وشەی نهێنی هەڵەیە"}
 }
 else if(a==="logout"){await signOut(auth);go("home")}
 else if(a==="savesoc"){
  const out={};
  for(const s of SOC){
   let val=$("s_"+s[2]).value.trim();
   if(val){
    if(s[2]==="whatsapp"&&/^\+?[\d\s]{7,18}$/.test(val))val="https://wa.me/"+val.replace(/\D/g,"");
    else if(!/^https?:\/\//i.test(val))val="https://"+val;
   }
   out[s[2]]=val;
  }
  try{await setDoc(doc(db,"settings","social"),out);$("se").textContent="";toast("هەڵگیرا")}
  catch(err){$("se").textContent="ڕێگەپێنەدراو: "+err.message}
 }
 else if(a==="fetchapp"){
  const m=($("asl").value.match(/id(\d+)/)||[])[1];
  if(!m){$("afe").textContent="لینکەکە دروست نییە";return}
  $("afe").textContent="چاوەڕێ بکە...";
  const cb="cb"+Date.now();
  window[cb]=d=>{
   delete window[cb];
   const r=d.results&&d.results[0];
   if(!r){$("afe").textContent="نەدۆزرایەوە";return}
   $("n").value=r.trackName||"";
   $("d").value=(r.description||"").slice(0,400);
   $("den").value=(r.description||"").slice(0,400);
   $("ver").value=r.version||"";
   $("size").value=r.fileSizeBytes?Math.round(r.fileSizeBytes/1048576)+" MB":"";
   $("i").value=r.artworkUrl512||"";
   $("sh").value=(r.screenshotUrls||[]).slice(0,5).join("\n");
   $("l").value=r.trackViewUrl||"";
   $("afe").textContent="پڕکرایەوە ✅";
  };
  const s=document.createElement("script");
  s.src="https://itunes.apple.com/lookup?id="+m+"&callback="+cb;
  s.onerror=()=>{$("afe").textContent="هەڵە لە پەیوەندی"};
  document.head.appendChild(s);
 }
 else if(a==="edit"){
  const ap=apps.find(i=>i.id===x);if(!ap)return;
  editId=x;
  const m={n:"name",d:"desc",den:"descEn",dar:"descAr",ver:"ver",size:"size",i:"icon",cv:"cover",sh:"shots",l:"link"};
  for(const k in m)$(k).value=ap[m[k]]||"";
  $("c").value=ap.cat;formMode();scrollTo({top:0,behavior:"smooth"});
 }
 else if(a==="cancel")resetForm();
 else if(a==="addapp"){
  const name=$("n").value.trim();
  if(!name){$("ae").textContent="ناوی ئەپ بنووسە";return}
  const data={name,cat:$("c").value,desc:$("d").value.trim(),descEn:$("den").value.trim(),descAr:$("dar").value.trim(),ver:$("ver").value.trim(),size:$("size").value.trim(),
   icon:$("i").value.trim(),cover:$("cv").value.trim(),shots:$("sh").value.trim(),link:$("l").value.trim()};
  try{
   if(editId)await updateDoc(doc(db,"apps",editId),{...data,upd:serverTimestamp()});
   else await addDoc(collection(db,"apps"),{...data,created:serverTimestamp()});
   resetForm();toast("هەڵگیرا");
  }catch(err){$("ae").textContent="ڕێگەپێنەدراو: "+err.message}
 }
 else if(a==="addban"){
  if(!$("bt").value.trim()){$("be").textContent="ناونیشان بنووسە";return}
  try{
   await addDoc(collection(db,"banners"),{title:$("bt").value.trim(),sub:$("bs").value.trim(),img:$("bi").value.trim(),link:$("bl").value.trim(),created:serverTimestamp()});
   ["bt","bs","bi","bl"].forEach(k=>$(k).value="");$("be").textContent="";
  }catch(err){$("be").textContent="ڕێگەپێنەدراو: "+err.message}
 }
 else if(a==="addnote"){
  if(!$("nt").value.trim())return;
  try{await addDoc(collection(db,"notices"),{title:$("nt").value.trim(),body:$("nb").value.trim(),created:serverTimestamp()});$("nt").value=$("nb").value=""}
  catch(err){toast(err.message)}
 }
 else if(a==="del"){
  if(!confirm("دڵنیایت؟"))return;
  const [col,id]=x.split(":");
  try{
   await deleteDoc(doc(db,col,id));
   if(col==="apps")ratings.filter(r=>r.app===id).forEach(r=>deleteDoc(doc(db,"ratings",r.id)).catch(()=>{}));
  }catch(err){toast(err.message)}
 }
});

if(location.hash==="#admin")v="admin";
applyStatic();
draw();
</script>
</body>
</html>
